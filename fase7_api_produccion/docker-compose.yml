# Opcional. No se pudo validar en este entorno (sin Docker disponible) -
# revisar antes de confiar en el build 1:1. El contexto de build es la raiz
# del repo (ver Dockerfile), porque la API reutiliza modulos de fases
# anteriores.
#
# Por defecto este compose usa REDIS_URL del .env (ej. Upstash, free tier),
# no el servicio `redis` local de aca abajo. Si preferis correr Redis 100%
# local en vez de la nube, comentar REDIS_URL en .env y descomentar la
# dependencia `depends_on: [redis]` + usar `redis://redis:6379/0` como
# REDIS_URL.
services:
  app:
    build:
      context: ..
      dockerfile: fase7_api_produccion/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
